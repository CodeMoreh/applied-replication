# Applied Replication for Data Skills – site variables.
#
# This is the ONE file to edit for site-wide facts and for scheduling a
# delivery. Three parts:
#   1. Evergreen variables – stable across deliveries; used in prose via the
#      Quarto shortcode {{< var name.subname >}}.
#   2. The delivery block – set delivery.active to 'true' to switch the
#      next-delivery callout on the landing page on; set it back to 'false'
#      for the evergreen (no-date) site. Nothing else needs touching.
#   3. The last-delivery block – a record of the most recent delivery, kept
#      for the organiser and for the README. No page renders it.

# --- Evergreen variables --------------------------------------------------
workshop:
  name: "Applied Replication for Data Skills"
  # The scale at which the course is deliverable, rather than the length of any
  # one delivery: the four track pages under tracks/ are what this string refers
  # to. It is rendered inside the landing page subtitle, so keep any replacement
  # short.
  format: "one day to a semester"
  organiser: "Chris Moreh"
  # Add a public contact address here if you want one shown on the site.
  contact: ""

site-url: "https://codemoreh.github.io/applied-replication/"
org: "https://github.com/CodeMoreh"

# --- Frozen live-results pipeline (see facilitator/live-results-setup.md).
# Do not rename or reformat these three keys: template-repo, live-results-url
# and results-form-url wire a working results pipeline end to end.
template-repo: "https://github.com/CodeMoreh/replication-lab"
# The Multiverse page where submissions appear live:
live-results-url: "https://codemoreh.github.io/applied-replication/results.html"
# The Google Form participants submit results to. PLACEHOLDER – replace with the
# real form URL once created (facilitator/live-results-setup.md, step 1):
results-form-url: "https://forms.gle/MWhimagFDmGtprAPA"

# --- Next-delivery block --------------------------------------------------
# Set active to 'true' to schedule a delivery; fill in the fields below.
# Set active back to 'false' to return the site to its evergreen state.
delivery:
  active: 'false'
  # Which of the four tracks this delivery follows, named by its page under
  # tracks/. Valid values: one-day, three-days, semester, self-study – i.e.
  # tracks/one-day.qmd and so on. An empty value prints no track line in the
  # callout, and so does a value that matches none of the four.
  track: ""
  date: "Monday 3 August 2026, 10:00–18:00 EEST"
  venue: "Online"
  event: "Făgăraș Summer School"
  mode: "Online, free, open to all"
  registration_url: ""
  note: "Four 90-minute sessions – 10:00–11:30, 12:00–13:30, 14:30–16:00, 16:30–18:00, Romanian time (EEST, UTC+3). Nothing to install unless you want to: pick either route on the [Setup](setup.qmd) page."

# --- Last delivery ---------------------------------------------------------
# A record of the most recent delivery, kept for the organiser and for the
# README. No page renders it.
last-delivery:
  event: "Făgăraș Summer School (online)"
  date: "3 August 2026"

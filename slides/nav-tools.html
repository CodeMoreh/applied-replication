<script>
/* ------------------------------------------------------------------ *
   Navigating a 146-slide deck from the front of a room.

   Four things live here, none of which reveal.js gives you by default.

   1. OPTIONAL DEPTH IS A SWITCH, NOT A LABEL. The tutorial runs are marked
      `.deepdive` in the source. `?depth=0` in the address opens the lean
      deck; the `d` key toggles them live, mid-delivery. Hidden slides leave
      the deck entirely - they are skipped by every navigation key and drop
      out of the slide count, so the position readout stays truthful.

   2. A POSITION READOUT THAT NAMES WHERE YOU ARE. "72/146" tells a
      facilitator nothing. This prints the part, the position inside it, the
      position overall, and a badge saying which version of the deck is on
      the projector - extended, lean, or extended-and-inside-an-optional-run.

   3. A JUMP BAR. `g` opens a filter box: type a few letters of any slide
      title and press Enter.

   4. PART JUMPS ON `[` AND `]`, deliberately not on the arrow keys - see the
      navigation-mode comment in _metadata.yml for why.
 * ------------------------------------------------------------------ */
(function () {
  var depthOn = new URLSearchParams(location.search).get("depth") !== "0";

  function deepdives() {
    return Array.prototype.slice.call(
      document.querySelectorAll("section.deepdive"));
  }

  /* Hiding a slide means taking it OUT OF THE DOM, not flagging it.
     `data-visibility="hidden"` looks like the right mechanism and is not:
     reveal acts on it once, in its own setup pass, by deleting the node. Set
     the attribute afterwards and reveal ignores it - the slide stays in the
     deck, every key still walks into it, and only the labels change. So the
     nodes come out here, each leaving a comment behind to mark its place, and
     go back into that exact slot when the runs are switched on again. */
  var stash = [];

  function hideRuns() {
    if (stash.length) return;
    deepdives().forEach(function (s) {
      var mark = document.createComment("deepdive");
      s.parentNode.insertBefore(mark, s);
      s.parentNode.removeChild(s);
      stash.push({ node: s, mark: mark });
    });
  }

  function showRuns() {
    stash.forEach(function (it) {
      it.mark.parentNode.replaceChild(it.node, it.mark);
    });
    stash = [];
  }

  /* The first non-optional slide after this one - which is where the run was
     going to let out anyway. Read BEFORE the nodes are removed, or there is
     nothing left to walk. */
  function nextSurvivor(from) {
    var all = Array.prototype.slice.call(
      document.querySelectorAll(".reveal .slides section"))
      .filter(function (s) { return !s.querySelector("section"); });
    for (var k = all.indexOf(from) + 1; k > 0 && k < all.length; k++) {
      if (!all[k].classList.contains("deepdive")) return all[k];
    }
    return null;
  }

  function applyDepth() {
    var ready = window.Reveal && Reveal.isReady && Reveal.isReady();
    var here = ready ? Reveal.getCurrentSlide() : null;
    var landing = (!depthOn && here && here.classList.contains("deepdive"))
      ? nextSurvivor(here) : null;

    if (depthOn) showRuns(); else hideRuns();
    document.body.classList.toggle("depth-off", !depthOn);

    if (ready) {
      Reveal.sync();
      /* Move by index rather than by hash. A hash change is asynchronous, and
         reveal goes on reporting the slide that was just detached until it
         lands - which is long enough for the readout to describe a slide that
         no longer exists. */
      var go = landing || (here && here.isConnected ? here : null);
      if (go) {
        var ix = Reveal.getIndices(go);
        Reveal.slide(ix.h, ix.v);
      }
    }
    updateReadout();
  }

  /* A toast, because a toggle with no feedback is a toggle you press twice. */
  function flash(msg) {
    var el = document.getElementById("nav-toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "nav-toast";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add("on");
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.classList.remove("on"); }, 1400);
  }

  /* ---- position readout ---------------------------------------------- */

  /* The deck's horizontal stacks are the four parts plus the front matter.
     A stack's name is the h1 on its title slide; the front matter has none. */
  function stackName(h) {
    var stacks = document.querySelectorAll(".reveal .slides > section");
    var st = stacks[h];
    if (!st) return "";
    var t = st.querySelector("section.level1 h1, h1");
    if (!t) return "Opening";
    /* "PART 3 – What you can actually do" reads as "PART 3" in the corner.
       This file is UTF-8 and the character class below holds a real en-dash:
       edit it with something that knows that, or the dash comes back as
       mojibake and every part shows its full title. */
    return t.textContent.replace(/\s*[–-].*$/, "").trim();
  }

  /* Every slide reveal will actually stop on and count. The References slide
     is marked uncounted, so it is navigable but outside the total - which is
     why the position can legitimately come back empty. */
  function visibleSlides() {
    return Array.prototype.slice.call(
      document.querySelectorAll(".reveal .slides section"))
      .filter(function (s) {
        return !s.querySelector("section") &&
               s.getAttribute("data-visibility") !== "uncounted";
      });
  }

  /* The optional runs, as runs rather than as 35 loose slides: consecutive
     .deepdive siblings in document order form one tutorial, so a slide can
     report "2/12" - where it sits inside its own run - and not merely that it
     is optional. Computed once; the DOM order never changes. */
  var runs = null;
  function optionalRuns() {
    if (runs) return runs;
    runs = [];
    var leaves = Array.prototype.slice.call(
      document.querySelectorAll(".reveal .slides section"))
      .filter(function (s) { return !s.querySelector("section"); });
    var cur = null;
    leaves.forEach(function (s) {
      if (s.classList.contains("deepdive")) {
        if (!cur) { cur = []; runs.push(cur); }
        cur.push(s);
      } else cur = null;
    });
    return runs;
  }

  function runPosition(slide) {
    var rs = optionalRuns();
    for (var i = 0; i < rs.length; i++) {
      var k = rs[i].indexOf(slide);
      if (k > -1) return { n: k + 1, of: rs[i].length };
    }
    return null;
  }

  function updateReadout() {
    if (!window.Reveal || !Reveal.isReady || !Reveal.isReady()) return;
    var el = document.getElementById("nav-readout");
    if (!el) {
      el = document.createElement("div");
      el.id = "nav-readout";
      document.querySelector(".reveal").appendChild(el);
    }
    var i = Reveal.getIndices();
    var cur = Reveal.getCurrentSlide();
    var all = visibleSlides();
    var overall = all.indexOf(cur) + 1;

    /* Position inside this part, on the same counting rule as the total. */
    var stacks = document.querySelectorAll(".reveal .slides > section");
    var st = stacks[i.h];
    var inPart = st ? Array.prototype.slice.call(
      st.querySelectorAll("section")).filter(function (s) {
        return s.getAttribute("data-visibility") !== "uncounted";
      }) : [];
    var vPos = inPart.indexOf(cur) + 1;

    /* Second line: which version of the deck is on the projector, and - when
       the slide on screen belongs to an optional run - where inside it. */
    var mode, runTxt = "";
    if (!depthOn) {
      mode = "lean";
    } else if (cur && cur.classList.contains("deepdive")) {
      mode = "optional";
      var rp = runPosition(cur);
      if (rp) runTxt = '<span class="nrun">' + rp.n + "/" + rp.of + "</span>";
    } else {
      mode = "extended";
    }

    /* An uncounted slide has no position, so it shows the totals alone rather
       than a fabricated one. */
    el.innerHTML =
      '<div class="nr-pos">' +
        '<span class="np">' + stackName(i.h) + "</span>" +
        (vPos > 0 ? '<span class="nv">' + vPos + "/" + inPart.length + "</span>" : "") +
        '<span class="nt">' + (overall > 0 ? overall : "–") + "/" + all.length + "</span>" +
      "</div>" +
      '<div class="nr-mode">' +
        '<span class="badge ' + mode + '">' + mode + "</span>" + runTxt +
      "</div>";
  }

  /* ---- jump bar ------------------------------------------------------- */

  function slideTitle(s) {
    var h = s.querySelector("h1, h2, h3");
    return h ? h.textContent.trim() : (s.id || "(untitled)");
  }

  function openJump() {
    var box = document.getElementById("nav-jump");
    if (box) { box.remove(); return; }
    box = document.createElement("div");
    box.id = "nav-jump";
    box.innerHTML = '<input type="text" placeholder="type part of a slide title, then Enter">' +
                    '<ul></ul>';
    document.body.appendChild(box);
    var input = box.querySelector("input"), list = box.querySelector("ul");
    var items = visibleSlides().map(function (s, n) {
      return { s: s, n: n + 1, t: slideTitle(s), part: "" };
    });
    function render(q) {
      var hits = items.filter(function (it) {
        return !q || it.t.toLowerCase().indexOf(q.toLowerCase()) > -1;
      }).slice(0, 12);
      list.innerHTML = hits.map(function (it, k) {
        return '<li data-id="' + it.s.id + '"' + (k === 0 ? ' class="sel"' : "") +
               '><b>' + it.n + "</b> " + it.t + "</li>";
      }).join("");
    }
    render("");
    input.addEventListener("input", function () { render(input.value); });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        var sel = list.querySelector("li");
        if (sel) { location.hash = "/" + sel.getAttribute("data-id"); }
        box.remove(); e.preventDefault(); e.stopPropagation();
      } else if (e.key === "Escape") { box.remove(); }
      e.stopPropagation();
    });
    list.addEventListener("click", function (e) {
      var li = e.target.closest("li");
      if (li) { location.hash = "/" + li.getAttribute("data-id"); box.remove(); }
    });
    input.focus();
  }

  /* ---- wiring --------------------------------------------------------- */

  function typing() {
    var a = document.activeElement;
    return a && /^(INPUT|TEXTAREA)$/.test(a.tagName);
  }

  /* Part-to-part jumps on their own keys rather than on the arrows.
     reveal's 'vertical' navigation mode would put this on the right arrow,
     but a presentation clicker sends right arrow, and a clicker that skips a
     whole part mid-sentence is not a feature. So the forward keys stay
     strictly linear and the part jump gets its own bracket keys. */
  function jumpPart(delta) {
    var i = Reveal.getIndices();
    var stacks = document.querySelectorAll(".reveal .slides > section");
    var h = Math.min(Math.max(i.h + delta, 0), stacks.length - 1);
    if (h === i.h) return;
    Reveal.slide(h, 0);
    flash(stackName(h));
  }

  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.altKey || e.metaKey || typing()) return;
    if (e.key === "d") {
      depthOn = !depthOn;
      applyDepth();
      flash(depthOn ? "extended deck" : "lean deck");
    } else if (e.key === "g") {
      openJump();
      e.preventDefault();
    } else if (e.key === "]") {
      jumpPart(1);
    } else if (e.key === "[") {
      jumpPart(-1);
    }
  });

  function boot() {
    if (!window.Reveal || !Reveal.isReady || !Reveal.isReady()) {
      return setTimeout(boot, 60);
    }
    optionalRuns();   /* capture the run structure while every slide is still present */
    applyDepth();
    Reveal.on("slidechanged", updateReadout);
    updateReadout();
  }
  document.addEventListener("DOMContentLoaded", boot);
  boot();
})();
</script>
